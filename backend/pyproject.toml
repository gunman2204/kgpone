[project]
name = "backend"
version = "0.1.0"
description = "KnowledgeOS Backend powered by FastAPI, LangGraph and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "fastmcp>=0.4.1",
    "langchain>=0.3.0",
    "langgraph>=0.2.14",
    "boto3>=1.35.0",
    "qdrant-client>=1.11.1",
    "neo4j>=5.24.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.34",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "llama-parse>=0.6.94",
    "fastapi-csrf-protect>=1.0.7",
    "slowapi>=0.1.9",
    "python-jose>=3.5.0",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-google-genai>=1.0.1",
    "langchain-openai>=0.1.22",
    "langchain-groq>=0.1.9",
    "langchain-huggingface>=0.0.3",
    "pwdlib[argon2]>=0.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
    "langchain-community>=0.4.2",
    "ddgs>=9.14.4",
    "pypdf>=4.0.0",
    "gliner>=0.2.27",
    "spacy>=3.8.14",
    "rapidfuzz>=3.14.5",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "en-core-web-sm",
    "watchdog>=6.0.0",
    "aiosqlite>=0.22.1",
    "langchain-ollama>=1.1.0",
]

[tool.pyright]
include = ["src", "alembic"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

